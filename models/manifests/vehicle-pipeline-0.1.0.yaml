    version: "0.1.0"
    path: plate-ocr-baseline-latin/0.1.0/model.tar.gz
    object_key: models/plate-ocr-baseline-latin/0.1.0/model.tar.gz
    sha256: bb459e79debf7b2c1ba40ccff6d20741fab6e762688073c6edad1a67bbdc139a
    source: https://bj.bcebos.com/v1/paddledet/models/pipeline/ch_PP-OCRv3_rec_infer.tar.gz
    license: Apache-2.0/upstream-paddle
    production_ready: false
    notes: Latin/Chinese comparative baseline used until cyrillic_PP-OCRv5 is approved.
missing_models:
  - name: vehicle-size
    reason: requires customer taxonomy and labeled crops
  - name: russian-plate-detector
    reason: requires labeled Russian plate dataset
  - name: cyrillic_pp-ocrv5_mobile_rec
    reason: intentionally skipped; pipeline runs with latin baseline allowlist
