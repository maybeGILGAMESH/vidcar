pipeline_version: vehicle-pipeline-0.1.0
schema_version: model-manifest-1
approved_root_hint: .runtime/model-registry/approved
rollback_of: null
ocr_capability:
  mode: latin
  production_russian_ocr: false
  alphabet_allowlist_latin: "0123456789ABCEHKMOPTXY"
  alphabet_allowlist_russian: "0123456789АВЕКМНОРСТУХ"
  translation: latin_to_russian_plate_lookalikes
  notes: >-
    Uses already downloaded latin/chinese OCR baseline. Cyrillic HF model is skipped.
    Recognized Latin lookalikes are translated locally to the Russian plate alphabet
    (A→А, B→В, E→Е, K→К, M→М, H→Н, O→О, P→Р, C→С, T→Т, Y→У, X→Х). This is not
    production Russian OCR.
models:
  vehicle_detector:
    name: ppvehicle-detector
    version: "0.1.0"
    path: vehicle-detector/0.1.0/model.zip
    object_key: models/vehicle-detector/0.1.0/model.zip
    sha256: 89253e5a46061d726949983b1b5db4aa10a7e0117c9629a949b6ed57d0eb17d7
    source: https://bj.bcebos.com/v1/paddledet/models/pipeline/mot_ppyoloe_l_36e_ppvehicle.zip
    license: Apache-2.0/upstream-paddle
  vehicle_attributes:
    name: vehicle-attributes
    version: "0.1.0"
    path: vehicle-attributes/0.1.0/model.zip
    object_key: models/vehicle-attributes/0.1.0/model.zip
    sha256: 3e687207dfac519e76351cd8e08716e15a075f61e4b2ba0f3d4d2abbe9627192
    source: https://bj.bcebos.com/v1/paddledet/models/pipeline/vehicle_attribute_model.zip
    license: Apache-2.0/upstream-paddle
    production_ready: false
    notes: Not a light/medium/heavy/unknown classifier.
  plate_detector:
    name: plate-detector-baseline
    version: "0.1.0"
    path: plate-detector-baseline/0.1.0/model.tar.gz
    object_key: models/plate-detector-baseline/0.1.0/model.tar.gz
